services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: oner
      POSTGRES_PASSWORD: oner
      POSTGRES_DB: oner
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oner"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://oner:oner@db:5432/oner
    ports:
      - "8000:8000"

volumes:
  pgdata:
