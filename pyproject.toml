[project]
name = "oner"
version = "0.1.0"
description = "ONER — course platform backend (FastAPI + Postgres). Buy → own → watch flow with server-side entitlements."
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.4",
    "boto3>=1.43.91",
    "email-validator>=2.3.0",
    "fastapi[standard]>=0.138.0",
    "httpx>=0.28.1",
    "passlib[argon2]>=1.7.4",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.14.2",
    "python-jose[cryptography]>=3.5.0",
    "slowapi>=0.1.10",
    "sqlmodel>=0.0.38",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["app"]
