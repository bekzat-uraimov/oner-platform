name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: oner
          POSTGRES_PASSWORD: oner
          POSTGRES_DB: oner
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oner"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://oner:oner@localhost:5432/oner
      JWT_SECRET: ci-test-secret

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen

      - name: Apply migrations (Postgres)
        run: uv run alembic upgrade head

      - name: Seed sample data
        run: uv run python -m app.seed

      - name: Run tests
        run: uv run pytest --cov=app --cov-report=term-missing
